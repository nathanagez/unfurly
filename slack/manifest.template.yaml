display_information:
  name: unfurly
  description: Plays Instagram reels right inside Slack.

features:
  bot_user:
    display_name: unfurly
    always_online: false
  unfurl_domains:
    - instagram.com
    - "{{PUBLIC_DOMAIN}}"

oauth_config:
  scopes:
    bot:
      - links:read
      - links:write
      - links.embed:write

settings:
  event_subscriptions:
    request_url: "{{REQUEST_URL}}"
    bot_events:
      - link_shared
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
